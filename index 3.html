<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SICHTUNG — Filmkonto der Crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Inter:ital@1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1115;
    --surface:#171A21;
    --surface-2:#1D2129;
    --line:#262B35;
    --ink:#EDEFF2;
    --muted:#8B93A1;
    --amber:#E8A33D;
    --amber-dim:#7A5A22;
    --velvet:#7A2436;
    --velvet-bright:#B23A54;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Bebas Neue',sans-serif;letter-spacing:.03em;}

  /* ---------- top bar ---------- */
  header.bar{
    position:sticky;top:0;z-index:40;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;
    background:rgba(15,17,21,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:baseline;gap:8px;}
  .brand .bulb{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px 2px var(--amber);}
  .brand h1{font-size:26px;margin:0;line-height:1;}
  .brand small{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;}
  .me{display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .me span{font-size:13px;font-weight:600;}

  /* ---------- tabs ---------- */
  nav.tabs{
    display:flex;gap:2px;padding:0 18px;
    border-bottom:1px solid var(--line);
    overflow-x:auto;
  }
  nav.tabs button{
    background:none;border:none;color:var(--muted);
    font-family:'Inter';font-weight:600;font-size:13px;letter-spacing:.03em;
    padding:14px 14px 12px;cursor:pointer;border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--amber);}

  main{max-width:1100px;margin:0 auto;padding:20px 16px 90px;}
  .view{display:none;} .view.active{display:block;}

  /* ---------- search ---------- */
  .searchbox{position:relative;margin-bottom:18px;}
  .searchbox input{
    width:100%;padding:14px 16px;border-radius:var(--radius);
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    font-size:15px;font-family:'Inter';
  }
  .searchbox input:focus{outline:none;border-color:var(--amber);}
  .section-label{
    font-family:'Bebas Neue';letter-spacing:.05em;color:var(--muted);
    font-size:15px;margin:22px 0 10px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:14px;
  }
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;cursor:pointer;transition:transform .15s ease,border-color .15s ease;
    position:relative;
  }
  .card:active{transform:scale(.97);}
  .card:hover{border-color:#3a4152;}
  .poster{width:100%;aspect-ratio:2/3;background:var(--surface-2) center/cover;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center;padding:8px;}
  .card-body{padding:9px 10px 11px;}
  .card-title{font-size:13px;font-weight:700;line-height:1.25;margin:0 0 2px;}
  .card-year{font-size:11px;color:var(--muted);}
  .badge{
    position:absolute;top:7px;right:7px;background:rgba(15,17,21,.85);
    border:1px solid var(--amber-dim);color:var(--amber);
    font-size:11px;font-weight:800;padding:2px 6px;border-radius:6px;
    display:flex;align-items:center;gap:3px;
  }
  .watched-tick{
    position:absolute;top:7px;left:7px;background:var(--velvet);
    color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;
  }

  /* ---------- empty states ---------- */
  .empty{color:var(--muted);font-size:13px;padding:30px 4px;text-align:center;}

  /* ---------- modal ---------- */
  .modal-bg{
    position:fixed;inset:0;background:rgba(8,9,11,.72);z-index:100;
    display:none;align-items:flex-end;justify-content:center;
  }
  .modal-bg.active{display:flex;}
  @media(min-width:640px){ .modal-bg{align-items:center;} }
  .modal{
    background:var(--surface);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
    border-radius:16px 16px 0 0;border:1px solid var(--line);border-bottom:none;
    animation:up .18s ease;
  }
  @media(min-width:640px){ .modal{border-radius:16px;border-bottom:1px solid var(--line);} }
  @keyframes up{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-hero{width:100%;aspect-ratio:16/8;background:var(--surface-2) center/cover;position:relative;}
  .modal-hero .fade{position:absolute;inset:0;background:linear-gradient(180deg,transparent,var(--surface) 92%);}
  .modal-close{position:absolute;top:10px;right:10px;background:rgba(15,17,21,.7);border:1px solid var(--line);color:var(--ink);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;}
  .modal-content{padding:0 20px 24px;}
  .modal-content h2{font-family:'Bebas Neue';font-size:30px;letter-spacing:.02em;margin:2px 0 2px;}
  .meta-row{color:var(--muted);font-size:12px;margin-bottom:12px;}
  .overview{font-size:13px;line-height:1.55;color:#C5CAD3;margin-bottom:18px;}

  .rate-block{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
  .rate-block label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  .rate-value{font-family:'Bebas Neue';font-size:38px;color:var(--amber);line-height:1;margin:4px 0 8px;}
  input[type=range]{width:100%;accent-color:var(--amber);height:6px;}
  textarea{
    width:100%;margin-top:10px;padding:10px;border-radius:8px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-family:'Inter';font-size:13px;resize:vertical;min-height:54px;
  }
  .btn{
    width:100%;padding:13px;border-radius:8px;border:none;cursor:pointer;
    font-family:'Inter';font-weight:700;font-size:14px;margin-top:10px;
  }
  .btn-primary{background:var(--amber);color:#221703;}
  .btn-secondary{background:none;border:1px solid var(--line);color:var(--ink);}

  .crew-ratings{display:flex;flex-direction:column;gap:8px;}
  .crew-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);}
  .crew-row:first-child{border-top:none;}
  .crew-row .name{font-size:13px;font-weight:600;flex:1;}
  .crew-row .score{font-family:'Bebas Neue';font-size:20px;color:var(--amber);}
  .crew-row .note{font-size:11px;color:var(--muted);font-style:italic;flex-basis:100%;margin-left:24px;margin-top:-4px;}

  /* ---------- stats ---------- */
  .stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:24px;}
  .stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
  .stat-card .num{font-family:'Bebas Neue';font-size:34px;color:var(--amber);line-height:1;}
  .stat-card .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px;}

  .lb-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);}
  .lb-row:first-child{border-top:none;}
  .lb-rank{font-family:'Bebas Neue';font-size:20px;color:var(--muted);width:22px;}
  .lb-poster{width:36px;height:52px;border-radius:5px;background:var(--surface-2) center/cover;flex-shrink:0;}
  .lb-info{flex:1;min-width:0;}
  .lb-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lb-sub{font-size:11px;color:var(--muted);}
  .lb-score{font-family:'Bebas Neue';font-size:22px;color:var(--amber);}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-row .bname{width:80px;font-size:12px;font-weight:600;flex-shrink:0;}
  .bar-track{flex:1;height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;}
  .bar-row .bval{width:32px;text-align:right;font-size:12px;color:var(--muted);}

  /* ---------- login ---------- */
  .login-bg{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{max-width:360px;width:100%;text-align:center;}
  .login-card .bulb{width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 16px 3px var(--amber);margin:0 auto 14px;}
  .login-card h1{font-size:44px;margin:0 0 6px;}
  .login-card p{color:var(--muted);font-size:13px;margin-bottom:26px;line-height:1.5;}
  .login-card input{
    width:100%;padding:14px 16px;border-radius:8px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-size:15px;text-align:center;margin-bottom:12px;
  }
  .login-card input:focus{outline:none;border-color:var(--amber);}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--velvet);color:#fff;padding:11px 18px;border-radius:999px;
    font-size:13px;font-weight:600;z-index:300;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  ::selection{background:var(--amber);color:#221703;}
</style>
</head>
<body>

<div id="loginScreen" class="login-bg">
  <div class="login-card">
    <div class="bulb"></div>
    <h1 class="display">SICHTUNG</h1>
    <p>Das private Filmkonto deiner Crew. Trag dich mit deinem Namen ein — deine Bewertungen werden mit allen geteilt.</p>
    <input id="nameInput" type="text" placeholder="Dein Name" maxlength="40" autocomplete="off">
    <button class="btn btn-primary" onclick="login()">Eintragen</button>
  </div>
</div>

<header class="bar" id="topbar" style="display:none;">
  <div class="brand">
    <span class="bulb"></span>
    <h1 class="display">SICHTUNG</h1>
  </div>
  <div class="me" onclick="switchUser()">
    <span class="dot" id="meDot"></span>
    <span id="meName"></span>
  </div>
</header>

<nav class="tabs" id="tabs" style="display:none;">
  <button class="active" data-tab="search" onclick="showTab('search')">Suchen</button>
  <button data-tab="wall" onclick="showTab('wall')">Wand</button>
  <button data-tab="stats" onclick="showTab('stats')">Statistik</button>
</nav>

<main id="app" style="display:none;">

  <div class="view active" id="view-search">
    <div class="searchbox">
      <input id="searchInput" type="text" placeholder="Film suchen … z.B. Interstellar" autocomplete="off">
    </div>
    <div class="section-label" id="searchLabel">Gerade beliebt</div>
    <div class="grid" id="searchGrid"></div>
  </div>

  <div class="view" id="view-wall">
    <div class="section-label">Geschaute Filme der Crew</div>
    <div class="grid" id="wallGrid"></div>
  </div>

  <div class="view" id="view-stats">
    <div class="stat-cards" id="statCards"></div>
    <div class="section-label">Bestbewertet</div>
    <div id="topList"></div>
    <div class="section-label">Durchschnitt pro Person</div>
    <div id="userBars" style="margin-top:6px;"></div>
  </div>

</main>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const IMG = 'https://image.tmdb.org/t/p/w342';
const IMG_BIG = 'https://image.tmdb.org/t/p/w780';
let me = null;
let currentMovie = null;
let allMovies = [];
let searchTimer = null;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

// ---------- auth ----------
function loadUser(){
  const raw = localStorage.getItem('sichtung_user');
  if(raw){
    me = JSON.parse(raw);
    enterApp();
  }
}
async function login(){
  const name = document.getElementById('nameInput').value.trim();
  if(!name) return;
  const res = await fetch('/api/users', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name})});
  const data = await res.json();
  if(data.error){ toast(data.error); return; }
  me = data.user;
  localStorage.setItem('sichtung_user', JSON.stringify(me));
  enterApp();
}
function switchUser(){
  localStorage.removeItem('sichtung_user');
  location.reload();
}
function enterApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('tabs').style.display = 'flex';
  document.getElementById('app').style.display = 'block';
  document.getElementById('meDot').style.background = me.color;
  document.getElementById('meName').textContent = me.name;
  loadPopular();
  loadMovies();
}
document.getElementById('nameInput').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });

// ---------- tabs ----------
function showTab(name){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  if(name==='stats') renderStats();
  if(name==='wall') renderWall();
}

// ---------- search / browse ----------
document.getElementById('searchInput').addEventListener('input', e=>{
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  searchTimer = setTimeout(()=> q ? doSearch(q) : loadPopular(), 350);
});

async function loadPopular(){
  document.getElementById('searchLabel').textContent = 'Gerade beliebt';
  const res = await fetch('/api/tmdb/popular');
  const data = await res.json();
  renderSearchGrid(data.results || []);
}
async function doSearch(q){
  document.getElementById('searchLabel').textContent = 'Suchergebnisse für "'+q+'"';
  const res = await fetch('/api/tmdb/search?q='+encodeURIComponent(q));
  const data = await res.json();
  renderSearchGrid(data.results || []);
}
function renderSearchGrid(results){
  const grid = document.getElementById('searchGrid');
  if(!results.length){ grid.innerHTML = '<div class="empty">Keine Treffer.</div>'; return; }
  grid.innerHTML = results.map(m=>{
    const watched = allMovies.find(x=>x.tmdb_id===m.tmdb_id);
    const badge = watched ? `<div class="watched-tick">gesehen</div>` : '';
    return `<div class="card" onclick='openMovie(${JSON.stringify(m).replace(/'/g,"&#39;")})'>
      ${badge}
      <div class="poster" style="${m.poster_path?`background-image:url(${IMG+m.poster_path})`:''}">${m.poster_path?'':m.title}</div>
      <div class="card-body">
        <p class="card-title">${escapeHtml(m.title)}</p>
        <p class="card-year">${(m.release_date||'').slice(0,4)}</p>
      </div>
    </div>`;
  }).join('');
}

// ---------- wall ----------
async function loadMovies(){
  const res = await fetch('/api/movies');
  const data = await res.json();
  allMovies = data.movies || [];
}
function renderWall(){
  const grid = document.getElementById('wallGrid');
  if(!allMovies.length){ grid.innerHTML = '<div class="empty">Noch keine Filme bewertet. Geh auf "Suchen" und leg los.</div>'; return; }
  grid.innerHTML = allMovies.map(m=>{
    const badge = m.average!==null ? `<div class="badge">★ ${m.average}</div>` : '';
    return `<div class="card" onclick='openMovie(${JSON.stringify(m).replace(/'/g,"&#39;")})'>
      ${badge}
      <div class="poster" style="${m.poster_path?`background-image:url(${IMG+m.poster_path})`:''}">${m.poster_path?'':m.title}</div>
      <div class="card-body">
        <p class="card-title">${escapeHtml(m.title)}</p>
        <p class="card-year">${(m.release_date||'').slice(0,4)} · ${m.rating_count} Bewertung${m.rating_count===1?'':'en'}</p>
      </div>
    </div>`;
  }).join('');
}

// ---------- movie modal ----------
async function openMovie(m){
  currentMovie = m;
  let full = m;
  // fetch full detail (genres/runtime/director) if not already cached
  if(!m.genres && !m.runtime){
    const res = await fetch('/api/tmdb/'+m.tmdb_id);
    const detail = await res.json();
    if(!detail.error) full = {...m, ...detail};
  }
  currentMovie = full;

  const ratingsRes = await fetch('/api/ratings?movie_tmdb_id='+full.tmdb_id);
  const ratingsData = await ratingsRes.json();
  const ratings = ratingsData.ratings || [];
  const mine = ratings.find(r=>r.user_id===me.id);

  const hero = full.backdrop_path ? `${IMG_BIG}${full.backdrop_path}` : (full.poster_path?`${IMG_BIG}${full.poster_path}`:'');
  const year = (full.release_date||'').slice(0,4);
  const crewHtml = ratings.length ? `<div class="crew-ratings">${ratings.map(r=>`
      <div class="crew-row">
        <span class="dot" style="background:${r.color}"></span>
        <span class="name">${escapeHtml(r.name)}</span>
        <span class="score">${r.rating}</span>
        ${r.note?`<span class="note">"${escapeHtml(r.note)}"</span>`:''}
      </div>`).join('')}</div>` : `<p class="empty" style="padding:10px 0;">Noch keine Bewertung — sei der Erste.</p>`;

  document.getElementById('modal').innerHTML = `
    <div class="modal-hero" style="${hero?`background-image:url(${hero})`:''}">
      <div class="fade"></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-content">
      <h2>${escapeHtml(full.title)}</h2>
      <div class="meta-row">${year}${full.runtime?` · ${full.runtime} Min`:''}${full.genres?` · ${full.genres}`:''}${full.director?` · Regie: ${escapeHtml(full.director)}`:''}</div>
      <p class="overview">${escapeHtml(full.overview||'')}</p>

      <div class="rate-block">
        <label>Deine Bewertung</label>
        <div class="rate-value" id="rateVal">${mine?mine.rating.toFixed(1):'5.0'}</div>
        <input type="range" id="rateSlider" min="0.5" max="10" step="0.5" value="${mine?mine.rating:5}" oninput="document.getElementById('rateVal').textContent=parseFloat(this.value).toFixed(1)">
        <textarea id="rateNote" placeholder="Kurze Notiz (optional)">${mine&&mine.note?escapeHtml(mine.note):''}</textarea>
        <button class="btn btn-primary" onclick="saveRating()">${mine?'Bewertung aktualisieren':'Als gesehen markieren & bewerten'}</button>
      </div>

      <label style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;">Bewertungen der Crew</label>
      <div style="margin-top:8px;">${crewHtml}</div>
    </div>
  `;
  document.getElementById('modalBg').classList.add('active');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('active'); }

async function saveRating(){
  const rating = parseFloat(document.getElementById('rateSlider').value);
  const note = document.getElementById('rateNote').value.trim();
  const res = await fetch('/api/ratings', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ user_id: me.id, movie: currentMovie, rating, note })
  });
  const data = await res.json();
  if(data.error){ toast(data.error); return; }
  toast('Gespeichert.');
  closeModal();
  await loadMovies();
  renderWall();
}

// ---------- stats ----------
function renderStats(){
  const rated = allMovies.filter(m=>m.rating_count>0);
  const totalRatings = rated.reduce((s,m)=>s+m.rating_count,0);
  const overallAvg = totalRatings ? (rated.reduce((s,m)=>s+m.average*m.rating_count,0)/totalRatings) : 0;

  const userMap = {};
  rated.forEach(m=>m.ratings.forEach(r=>{
    (userMap[r.user_id] ||= {name:r.name, color:r.color, sum:0, count:0}).sum += r.rating;
    userMap[r.user_id].count += 1;
  }));
  const users = Object.values(userMap).map(u=>({...u, avg: u.sum/u.count})).sort((a,b)=>b.avg-a.avg);

  document.getElementById('statCards').innerHTML = `
    <div class="stat-card"><div class="num">${rated.length}</div><div class="lbl">Filme gesehen</div></div>
    <div class="stat-card"><div class="num">${totalRatings}</div><div class="lbl">Bewertungen</div></div>
    <div class="stat-card"><div class="num">${overallAvg?overallAvg.toFixed(1):'–'}</div><div class="lbl">Ø Crew-Wertung</div></div>
    <div class="stat-card"><div class="num">${users.length}</div><div class="lbl">Mitglieder</div></div>
  `;

  const top = [...rated].sort((a,b)=>b.average-a.average).slice(0,5);
  document.getElementById('topList').innerHTML = top.length ? top.map((m,i)=>`
    <div class="lb-row" onclick='openMovie(${JSON.stringify(m).replace(/'/g,"&#39;")})' style="cursor:pointer;">
      <div class="lb-rank">${i+1}</div>
      <div class="lb-poster" style="${m.poster_path?`background-image:url(${IMG+m.poster_path})`:''}"></div>
      <div class="lb-info">
        <div class="lb-title">${escapeHtml(m.title)}</div>
        <div class="lb-sub">${m.rating_count} Bewertung${m.rating_count===1?'':'en'}</div>
      </div>
      <div class="lb-score">${m.average}</div>
    </div>`).join('') : '<div class="empty">Noch keine Daten.</div>';

  const maxAvg = Math.max(...users.map(u=>u.avg), 10);
  document.getElementById('userBars').innerHTML = users.length ? users.map(u=>`
    <div class="bar-row">
      <div class="bname">${escapeHtml(u.name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(u.avg/10*100).toFixed(0)}%;background:${u.color}"></div></div>
      <div class="bval">${u.avg.toFixed(1)}</div>
    </div>`).join('') : '<div class="empty">Noch keine Daten.</div>';
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

loadUser();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Filmbewerter">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="manifest" href="/manifest.json">
<title>Filmbewerter3000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1115; --surface:#171A21; --surface-2:#1D2129; --line:#262B35;
    --ink:#EDEFF2; --muted:#8B93A1; --amber:#E8A33D; --amber-dim:#7A5A22;
    --velvet:#7A2436; --green:#7FBF8C; --radius:12px;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --ease: cubic-bezier(.32,.72,0,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{height:-webkit-fill-available;}
  html,body{margin:0;padding:0;overscroll-behavior-y:none;}
  body{
    background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; min-height:-webkit-fill-available;
    -webkit-font-smoothing:antialiased; touch-action:manipulation;
  }
  .display{font-family:'Bebas Neue',sans-serif;letter-spacing:.03em;}
  button,.card,.opt{touch-action:manipulation;user-select:none;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }

  header.bar{
    position:sticky;top:0;z-index:40;padding-top:calc(14px + var(--sat));
    display:flex;align-items:center;justify-content:space-between;
    padding-left:18px;padding-right:18px;padding-bottom:14px;
    background:rgba(15,17,21,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:baseline;gap:8px;}
  .brand .bulb{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px 2px var(--amber);animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
  .brand h1{font-size:21px;margin:0;line-height:1;}
  .me{display:flex;align-items:center;gap:8px;cursor:pointer;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);transition:transform .1s ease;}
  .me:active{transform:scale(.95);}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .me span{font-size:13px;font-weight:600;}

  nav.tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    background:none;border:none;color:var(--muted);font-family:'Inter';font-weight:600;
    font-size:13px;letter-spacing:.03em;padding:14px 14px 12px;cursor:pointer;
    border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s ease;
  }
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--amber);}

  main{max-width:1100px;margin:0 auto;padding:20px 16px calc(90px + var(--sab));}
  .view{display:none;} .view.active{display:block;animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .searchbox{position:relative;margin-bottom:18px;}
  .searchbox input{
    width:100%;padding:15px 16px;border-radius:var(--radius);border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-size:16px;font-family:'Inter';
    -webkit-appearance:none;transition:border-color .15s ease;
  }
  .searchbox input:focus{outline:none;border-color:var(--amber);}
  .section-label{font-family:'Bebas Neue';letter-spacing:.05em;color:var(--muted);font-size:15px;margin:22px 0 10px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;cursor:pointer;transition:transform .12s ease,border-color .15s ease;
    position:relative;opacity:0;animation:cardIn .35s var(--ease) forwards;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  .card:active{transform:scale(.96);}
  .card:hover{border-color:#3a4152;}
  .poster{width:100%;aspect-ratio:2/3;background:var(--surface-2) center/cover;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center;padding:8px;}
  .card-body{padding:9px 10px 11px;}
  .card-title{font-size:13px;font-weight:700;line-height:1.25;margin:0 0 2px;}
  .card-year{font-size:11px;color:var(--muted);}
  .badge{position:absolute;top:7px;right:7px;background:rgba(15,17,21,.85);border:1px solid var(--amber-dim);color:var(--amber);font-size:11px;font-weight:800;padding:2px 6px;border-radius:6px;}
  .watched-tick{position:absolute;top:7px;left:7px;background:var(--velvet);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;}
  .empty{color:var(--muted);font-size:13px;padding:30px 4px;text-align:center;}

  .skeleton{background:linear-gradient(100deg,var(--surface) 30%,var(--surface-2) 50%,var(--surface) 70%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;}

  /* trophies / achievements */
  .trophy-card{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;cursor:pointer;}
  .trophy-card:active{transform:scale(.99);}
  .trophy-icon{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:var(--surface-2);}
  .trophy-info{flex:1;min-width:0;}
  .trophy-title{font-weight:700;font-size:14px;}
  .trophy-tier{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:1px;}
  .trophy-bar{height:4px;background:var(--surface-2);border-radius:2px;margin-top:7px;overflow:hidden;}
  .trophy-fill{height:100%;border-radius:2px;transition:width .3s var(--ease);}
  .trophy-next{font-size:11px;color:var(--muted);margin-top:4px;}

  .trophy-tier-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);}
  .trophy-tier-row:last-of-type{border-bottom:none;}
  .trophy-tier-row.done .tt-name{color:var(--ink);}
  .tt-badge{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;margin-top:1px;}
  .tt-name{font-size:13.5px;font-weight:600;color:var(--muted);}
  .tt-desc{font-size:12px;color:var(--muted);margin-top:1px;}

  .trophy-preview{background:var(--surface-2);border-radius:var(--radius);padding:12px 14px;margin:16px 0;text-align:left;}
  .tp-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;}
  .tp-more{color:var(--amber);cursor:pointer;font-weight:600;}
  .tp-badges{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .tp-badge{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:15px;}

  .ach-unlock{padding:36px 24px calc(30px + var(--sab));text-align:center;}
  .ach-unlock-icon{width:84px;height:84px;border-radius:50%;border:3px solid var(--line);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 14px;animation:achPop .4s var(--ease);}
  @keyframes achPop{0%{transform:scale(.4);opacity:0;}70%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}
  .ach-unlock-tier{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
  .ach-unlock h3{font-family:'Bebas Neue';font-size:26px;margin:0 0 6px;}

  /* favorite movie */
  .fav-movie{display:flex;gap:12px;align-items:center;background:var(--surface-2);border-radius:var(--radius);padding:10px 12px;margin-top:14px;text-align:left;cursor:pointer;}
  .fav-poster{width:44px;height:66px;border-radius:6px;background:var(--surface) center/cover;flex-shrink:0;}
  .fav-info{min-width:0;}
  .fav-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  .fav-title{font-size:14px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  @keyframes shimmer{0%{background-position:180% 0;}100%{background-position:-20% 0;}}
  .sk-card{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);}
  .sk-poster{width:100%;aspect-ratio:2/3;}
  .sk-line{height:11px;margin:9px 10px;border-radius:4px;}
  .sk-line.short{width:60%;}

  .modal-bg{position:fixed;inset:0;background:rgba(8,9,11,.75);z-index:100;display:none;align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(2px);transition:background .2s ease;}
  .modal-bg.active{display:flex;}
  @media(min-width:640px){ .modal-bg{align-items:center;} }
  .modal{
    background:var(--surface);width:100%;max-width:540px;max-height:92vh;max-height:92dvh;
    overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:20px 20px 0 0;
    border:1px solid var(--line);border-bottom:none;animation:up .28s var(--ease);
    padding-bottom:var(--sab);will-change:transform;
  }
  @media(min-width:640px){ .modal{border-radius:18px;border-bottom:1px solid var(--line);} }
  @keyframes up{from{transform:translateY(40px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-grip{width:36px;height:4px;background:var(--line);border-radius:3px;margin:10px auto 0;cursor:grab;}
  .modal-hero{width:100%;aspect-ratio:16/8;background:var(--surface-2) center/cover;position:relative;margin-top:6px;}
  .modal-hero .fade{position:absolute;inset:0;background:linear-gradient(180deg,transparent,var(--surface) 92%);}
  .modal-close{position:absolute;top:10px;right:10px;background:rgba(15,17,21,.75);border:1px solid var(--line);color:var(--ink);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:transform .1s ease;}
  .modal-close:active{transform:scale(.9);}
  .play-trailer-btn{
    position:absolute;bottom:10px;left:10px;background:rgba(15,17,21,.8);border:1px solid rgba(232,163,61,.5);color:var(--amber);
    padding:8px 13px;border-radius:999px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer;transition:transform .1s ease;
  }
  .play-trailer-btn:active{transform:scale(.94);}
  .play-trailer-btn svg{width:12px;height:12px;fill:var(--amber);}
  .modal-content{padding:0 20px 24px;}
  .modal-content h2{font-family:'Bebas Neue';font-size:29px;letter-spacing:.02em;margin:2px 0 2px;}
  .meta-row{color:var(--muted);font-size:12px;margin-bottom:12px;}
  .overview{font-size:13px;line-height:1.55;color:#C5CAD3;margin-bottom:16px;}

  /* avatars */
  .av{border-radius:50%;flex-shrink:0;object-fit:cover;display:flex;align-items:center;justify-content:center;
      font-weight:700;color:#0F1115;font-size:11px;overflow:hidden;background-size:cover;background-position:center;}
  .av-22{width:22px;height:22px;font-size:10px;}
  .av-28{width:28px;height:28px;font-size:12px;}
  .av-72{width:72px;height:72px;font-size:26px;}

  .profile-sheet{padding:26px 20px calc(26px + var(--sab));text-align:center;}
  .profile-sheet .av{margin:0 auto 14px;}
  .profile-sheet h3{font-family:'Bebas Neue';font-size:26px;margin:0 0 2px;letter-spacing:.02em;}
  .profile-sheet .sub{font-size:12px;color:var(--muted);margin-bottom:22px;}
  .av-hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.45;}

  /* streaming providers */
  .prov-block{margin-bottom:16px;}
  .prov-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:7px;}
  .prov-logos{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
  .prov-logo{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);object-fit:cover;background:var(--surface-2);}
  .prov-more{font-size:11px;color:var(--muted);align-self:center;}

  /* "Für dich" — open tasks */
  .task-hero{background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line);
    border-radius:16px;padding:20px;margin-bottom:22px;}
  .task-hero .greet{font-family:'Bebas Neue';font-size:24px;letter-spacing:.02em;margin-bottom:3px;}
  .task-hero .sub{font-size:13px;color:var(--muted);line-height:1.5;}
  .task-count{display:inline-flex;align-items:center;gap:6px;background:rgba(232,163,61,.13);
    border:1px solid var(--amber-dim);color:var(--amber);border-radius:999px;
    padding:5px 12px;font-size:12px;font-weight:700;margin-top:12px;}

  .task-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;transition:opacity .1s ease;}
  .task-row:first-of-type{border-top:none;}
  .task-row:active{opacity:.6;}
  .task-poster{width:42px;height:62px;border-radius:6px;background:var(--surface-2) center/cover;flex-shrink:0;}
  .task-info{flex:1;min-width:0;}
  .task-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .task-why{font-size:11px;color:var(--muted);margin-top:2px;}
  .task-go{color:var(--amber);font-size:18px;flex-shrink:0;}
  .who-avatars{display:flex;margin-top:4px;}
  .who-avatars .av{margin-right:-6px;border:1.5px solid var(--surface);}

  .all-done{text-align:center;padding:36px 16px;}
  .all-done .big{font-size:34px;margin-bottom:8px;}
  .all-done .txt{font-size:13px;color:var(--muted);line-height:1.5;}

  /* discovery feed */
  .feed-head{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px;}
  .feed-head .fh-title{font-family:'Bebas Neue';font-size:17px;letter-spacing:.04em;}
  .feed-head .fh-sub{font-size:11px;color:var(--muted);}

  .feed-card{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    overflow:hidden;margin-bottom:16px;opacity:0;animation:cardIn .4s var(--ease) forwards;
  }
  .feed-poster{width:100%;aspect-ratio:16/9;background:var(--surface-2) center/cover;position:relative;}
  .feed-poster .pfade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,17,21,.1),var(--surface) 96%);}
  .feed-tmdb{position:absolute;top:10px;right:10px;background:rgba(15,17,21,.85);border:1px solid var(--amber-dim);
    color:var(--amber);font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;}
  .feed-body{padding:0 16px 16px;margin-top:-34px;position:relative;}
  .feed-title{font-family:'Bebas Neue';font-size:24px;letter-spacing:.02em;margin:0 0 2px;}
  .feed-meta{font-size:12px;color:var(--muted);margin-bottom:10px;}
  .feed-overview{font-size:12.5px;line-height:1.5;color:#B8BEC8;margin:0 0 14px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .feed-actions{display:flex;gap:9px;}
  .feed-actions button{
    flex:1;padding:13px;border-radius:10px;border:none;cursor:pointer;
    font-family:'Inter';font-weight:700;font-size:14px;transition:transform .1s ease,opacity .1s ease;
  }
  .feed-actions button:active{transform:scale(.97);opacity:.9;}
  .fa-rate{background:var(--amber);color:#221703;}
  .fa-skip{background:none;border:1px solid var(--line) !important;color:var(--muted);flex:0 0 40% !important;}

  .feed-sentinel{height:40px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;}
  .spinner{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* activity stream */
  .act-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
  .act-row:first-of-type{border-top:none;}
  .act-txt{flex:1;min-width:0;font-size:13px;line-height:1.45;}
  .act-txt b{font-weight:700;}
  .act-txt .film{color:var(--ink);font-weight:600;}
  .act-score{font-family:'Bebas Neue';font-size:17px;color:var(--amber);flex-shrink:0;}
  .act-time{font-size:11px;color:var(--muted);margin-top:1px;}
  .act-note{font-size:11.5px;color:var(--muted);font-style:italic;margin-top:3px;}

  /* crew */
  .crew-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .crew-card{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 14px;
    text-align:center;cursor:pointer;transition:transform .12s ease,border-color .15s ease;
    opacity:0;animation:cardIn .35s var(--ease) forwards;
  }
  .crew-card:active{transform:scale(.96);}
  .crew-card .av{margin:0 auto 10px;}
  .crew-card .cname{font-size:14px;font-weight:700;margin-bottom:3px;}
  .crew-card .cstat{font-size:11px;color:var(--muted);}
  .crew-card .cavg{font-family:'Bebas Neue';font-size:22px;color:var(--amber);margin-top:6px;line-height:1;}

  .prof-head{text-align:center;padding:24px 20px 6px;}
  .prof-head .av{margin:0 auto 12px;}
  .prof-head h3{font-family:'Bebas Neue';font-size:28px;margin:0 0 3px;letter-spacing:.02em;}
  .prof-stats{display:flex;justify-content:center;gap:26px;margin:14px 0 4px;}
  .prof-stat .n{font-family:'Bebas Neue';font-size:24px;color:var(--amber);line-height:1;}
  .prof-stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:3px;}

  /* expandable list */
  .expand-btn{
    width:100%;background:none;border:1px solid var(--line);color:var(--muted);
    border-radius:9px;padding:11px;font-family:'Inter';font-size:13px;font-weight:600;
    cursor:pointer;margin-top:12px;transition:color .15s ease,border-color .15s ease;
  }
  .expand-btn:active{color:var(--ink);border-color:#3a4152;}

  /* update banner */
  .update-bar{
    position:fixed;left:12px;right:12px;bottom:calc(14px + var(--sab));z-index:250;
    background:var(--amber);color:#221703;border-radius:12px;padding:13px 16px;
    display:none;align-items:center;justify-content:space-between;gap:12px;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
    transform:translateY(80px);transition:transform .3s var(--ease);
  }
  .update-bar.show{display:flex;transform:translateY(0);}
  .update-bar .ub-txt{font-size:13px;font-weight:600;line-height:1.35;}
  .update-bar button{
    background:#221703;color:var(--amber);border:none;border-radius:8px;
    padding:9px 15px;font-family:'Inter';font-weight:700;font-size:13px;cursor:pointer;flex-shrink:0;
  }

  /* rewatch */
  .rewatch-box{display:flex;align-items:center;gap:12px;background:var(--surface-2);
    border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-top:10px;}
  .rewatch-info{flex:1;min-width:0;}
  .rewatch-n{font-family:'Bebas Neue';font-size:22px;color:var(--amber);line-height:1;}
  .rewatch-l{font-size:11px;color:var(--muted);margin-top:2px;}
  .rewatch-btn{background:none;border:1px solid var(--amber-dim);color:var(--amber);
    border-radius:999px;padding:9px 14px;font-family:'Inter';font-weight:700;font-size:12.5px;
    cursor:pointer;flex-shrink:0;transition:transform .1s ease;}
  .rewatch-btn:active{transform:scale(.94);}
  .rw-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(232,163,61,.13);
    border:1px solid var(--amber-dim);color:var(--amber);border-radius:999px;
    padding:2px 8px;font-size:10.5px;font-weight:700;margin-left:6px;}

  /* directors */
  .dir-row{border-top:1px solid var(--line);}
  .dir-row:first-of-type{border-top:none;}
  .dir-head{display:flex;align-items:center;gap:12px;padding:13px 0;cursor:pointer;}
  .dir-rank{font-family:'Bebas Neue';font-size:19px;color:var(--muted);width:22px;flex-shrink:0;}
  .dir-info{flex:1;min-width:0;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}

  .login-bg{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;padding-bottom:calc(20px + var(--sab));}
  .login-card{max-width:360px;width:100%;text-align:center;animation:fadein .4s ease;}
  .login-card .bulb{width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 16px 3px var(--amber);margin:0 auto 14px;animation:pulse 2.4s ease-in-out infinite;}
  .login-card h1{font-size:38px;margin:0 0 6px;}
  .login-card p{color:var(--muted);font-size:13px;margin-bottom:26px;line-height:1.5;}
  .login-card input{width:100%;padding:15px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;text-align:center;margin-bottom:12px;-webkit-appearance:none;transition:border-color .15s ease;}

  .toast{
    position:fixed;bottom:calc(20px + var(--sab));left:50%;transform:translateX(-50%) translateY(6px);

    z-index:300;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s var(--ease);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  ::selection{background:var(--amber);color:#221703;}
</style>
</head>
<body>

<script>
const IMG = 'https://image.tmdb.org/t/p/w342';
const IMG_BIG = 'https://image.tmdb.org/t/p/w780';

const DIMENSIONS = [
  { key:'story', label:'Story', weight:0.30, question:'Wie war die Geschichte?',
    options:[
      {v:2,t:'Langweilig'},
      {v:4,t:'Schwach'},
      {v:6,t:'Ganz okay'},
      {v:8,t:'Richtig gut'},
      {v:10,t:'Der Wahnsinn'}
    ]},
  { key:'craft', label:'Optik', weight:0.20, question:'Wie sah der Film aus?',
    options:[
      {v:2,t:'Billig'},
      {v:4,t:'Nichts Besonderes'},
      {v:6,t:'Sauber gemacht'},
      {v:8,t:'Richtig schön'},
      {v:10,t:'Atemberaubend'}
    ]},
  { key:'impact', label:'Spannung', weight:0.35, question:'Hat er dich gefesselt?',
    options:[
      {v:2,t:'Fast eingeschlafen'},
      {v:4,t:'Oft abgelenkt'},
      {v:6,t:'War dabei'},
      {v:8,t:'Voll drin'},
      {v:10,t:'Konnte nicht wegschauen'}
    ]},
  { key:'echo', label:'Nochmal?', weight:0.15, question:'Würdest du ihn nochmal schauen?',
    options:[
      {v:2,t:'Auf keinen Fall'},
      {v:4,t:'Eher nicht'},
      {v:6,t:'Vielleicht'},
      {v:8,t:'Ja, gerne'},
      {v:10,t:'Immer wieder'}
    ]}
];

function computeScore(scores, adjust){
  let total = 0;
  for(const d of DIMENSIONS) total += (scores[d.key]||0) * d.weight;
  const withAdj = total + (adjust||0);
  return Math.min(10, Math.max(0.5, Math.round(withAdj*10)/10));
}

let me = null;
let currentMovie = null;
let allMovies = [];
let searchTimer = null;
let quiz = null;

/* Avatars are loaded once here and looked up by id when rendering.
   They are deliberately NOT sent along with every rating — otherwise
   each /api/movies call would drag along one image per rating. */
let usersMap = {};

async function loadUsers(){
  try{
    const res = await fetch('/api/users');
    const data = await res.json();
    usersMap = {};
    (data.users||[]).forEach(u=>{ usersMap[u.id] = u; });
    if(me && usersMap[me.id]){
      me.avatar = usersMap[me.id].avatar || null;
      me.color = usersMap[me.id].color || me.color;
      me.favorite_movie_tmdb_id = usersMap[me.id].favorite_movie_tmdb_id || null;
      localStorage.setItem('sichtung_user', JSON.stringify(me));
    }
  }catch(e){}
}

function avatarHtml(userId, name, color, size){
  const u = usersMap[userId];
  const av = u ? u.avatar : (me && me.id===userId ? me.avatar : null);
  const cls = 'av av-'+(size||22);
  if(av){

/* Square center-crop to 256px JPEG. Keeps stored images around 20 KB,
   small enough to live in D1 alongside the row. */
function resizeImage(file, size){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(size/img.width, size/img.height);
        const w = img.width*scale, h = img.height*scale;
        ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = ()=>reject(new Error('decode failed'));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.readAsDataURL(file);
  });
}

/* ---------- relative time in German ---------- */
function timeAgo(iso){
  if(!iso) return '';
  // SQLite datetime('now') returns "YYYY-MM-DD HH:MM:SS" in UTC.
  const t = Date.parse(iso.replace(' ', 'T') + (iso.endsWith('Z') ? '' : 'Z'));
  if(isNaN(t)) return '';
  const s = Math.max(0, Math.floor((Date.now() - t) / 1000));
  if(s < 60)    return 'gerade eben';
  if(s < 3600)  return `vor ${Math.floor(s/60)} Min`;
  if(s < 86400) { const h = Math.floor(s/3600); return `vor ${h} ${h===1?'Stunde':'Stunden'}`; }
  const d = Math.floor(s/86400);
  if(d === 1)  return 'gestern';
  if(d < 7)    return `vor ${d} Tagen`;
  if(d < 30)   { const w = Math.floor(d/7); return `vor ${w} ${w===1?'Woche':'Wochen'}`; }
  const mo = Math.floor(d/30);
  return `vor ${mo} ${mo===1?'Monat':'Monaten'}`;
}

/* ---------- activity stream ----------
   Flattened from the ratings already loaded with /api/movies, so this
   costs nothing extra. Newest first. */
function allActivity(){
  const acts = [];
  allMovies.forEach(m=>{
    (m.ratings||[]).forEach(r=>{
      acts.push({
        kind:'rating', user_id: r.user_id, name: r.name, color: r.color,
        rating: r.rating, note: r.note, when: r.watched_at,
        movie: m
      });
    });
  });
  allUnlockedAch.forEach(u=>{
    const a = ACHIEVEMENTS_BY_ID[u.achievement_id];
    if(!a) return;
    acts.push({
      kind:'achievement', user_id: u.user_id, name: u.name, color: u.color,
      when: u.unlocked_at, ach: a
    });
  });
  return acts.sort((a,b)=> String(b.when||'').localeCompare(String(a.when||'')));
}

/* ---------- crew ---------- */
function crewStats(){
  const map = {};
  // Everyone who exists, even if they haven't rated anything yet.
  Object.values(usersMap).forEach(u=>{
    map[u.id] = { id:u.id, name:u.name, color:u.color, sum:0, count:0, films:[] };
  });
  allMovies.forEach(m=>{
    (m.ratings||[]).forEach(r=>{
      if(!map[r.user_id]) map[r.user_id] = { id:r.user_id, name:r.name, color:r.color, sum:0, count:0, films:[] };
      map[r.user_id].sum += r.rating;
      map[r.user_id].count += 1;
      map[r.user_id].films.push({ movie:m, rating:r.rating, note:r.note, when:r.watched_at });
    });
  });
  return Object.values(map).map(u=>({
    ...u,
    avg: u.count ? u.sum/u.count : null,
    films: u.films.sort((a,b)=> b.rating - a.rating)
  })).sort((a,b)=> b.count - a.count);
}

/* ---------- stat computation ---------- */
function parseDbDate(s){
  if(!s) return NaN;
  return Date.parse(s.replace(' ','T') + (s.endsWith('Z') ? '' : 'Z'));
}

function userRatings(userId){
  const list = [];
  allMovies.forEach(m=>(m.ratings||[]).forEach(r=>{
    if(r.user_id===userId) list.push({...r, movie:m});
  }));
  return list;
}

function computeStats(userId){
  const myR = userRatings(userId);
  const notes = myR.filter(r=>r.note && r.note.trim()).length;
  const tens = myR.filter(r=>r.rating>=9.5).length;
  const heartFilms = myR.filter(r=>r.rating>=9).length;
  const verrisse = myR.filter(r=>r.rating<=2).length;
  const disappointments = myR.filter(r=>r.rating>2 && r.rating<4).length;
  const rewatches = myR.reduce((s,r)=>s+(r.rewatch_count||0),0);

  const genreSet = new Set(), genreCount = {};
  const dirSet = new Set(), dirCount = {};
  const decadeSet = new Set();
  let hoursWatched = 0;
  myR.forEach(r=>{
    const m = r.movie;
    (m.genres||'').split(',').map(g=>g.trim()).filter(Boolean).forEach(g=>{
      genreSet.add(g); genreCount[g]=(genreCount[g]||0)+1;
    });
    if(m.director){ dirSet.add(m.director); dirCount[m.director]=(dirCount[m.director]||0)+1; }
    const y = parseInt((m.release_date||'').slice(0,4));
    if(y) decadeSet.add(Math.floor(y/10)*10);
    if(m.runtime) hoursWatched += m.runtime/60;
  });
  const directorLoyalty = Object.values(dirCount).reduce((a,b)=>Math.max(a,b),0);
  const genreSpecialist = Object.values(genreCount).reduce((a,b)=>Math.max(a,b),0);

  const dayOf = s => (s||'').slice(0,10);
  const monthOf = s => (s||'').slice(0,7);
  const dayCounts = {}, monthCounts = {};
  const hourList = [];
  const dateSet = new Set();
  myR.forEach(r=>{
    const d = dayOf(r.watched_at);
    if(d){ dayCounts[d]=(dayCounts[d]||0)+1; dateSet.add(d); }
    const mo = monthOf(r.watched_at);
    if(mo) monthCounts[mo]=(monthCounts[mo]||0)+1;
    const hh = parseInt((r.watched_at||'').slice(11,13));
    if(!isNaN(hh)) hourList.push(hh);
  });
  const dayMarathon = Object.values(dayCounts).reduce((a,b)=>Math.max(a,b),0);
  const monthActive = Object.values(monthCounts).reduce((a,b)=>Math.max(a,b),0);
  const nightOwl = hourList.filter(h=>h>=0 && h<5).length;
  const earlyBird = hourList.filter(h=>h>=5 && h<8).length;

  const days = [...dateSet].sort();
  let run = 0, best = 0, prevT = null;
  days.forEach(d=>{
    const cur = Date.parse(d+'T00:00:00Z');
    run = (prevT!==null && cur - prevT === 86400000) ? run+1 : 1;
    best = Math.max(best, run);
    prevT = cur;
  });
  const streak = best;

  let weekActive = 0;
  days.forEach(d=>{
    const start = Date.parse(d+'T00:00:00Z');
    let count = 0;
    myR.forEach(r=>{
      const t = Date.parse(dayOf(r.watched_at)+'T00:00:00Z');
      if(t>=start && t < start + 7*86400000) count++;
    });
    weekActive = Math.max(weekActive, count);
  });

  const quickRater = myR.filter(r=>{
    const added = parseDbDate(r.movie.added_at);
    const watched = parseDbDate(r.watched_at);
    return !isNaN(added) && !isNaN(watched) && watched>=added && (watched-added) <= 4*86400000;
  }).length;

  const reactionsGiven = social.reactions.filter(r=>r.user_id===userId).length;
  const emojiVariety = new Set(social.reactions.filter(r=>r.user_id===userId).map(r=>r.emoji)).size;

  const myRatingIds = new Set(myR.map(r=>String(r.rating_id)));
  const myCommentIds = new Set(social.comments.filter(c=>c.user_id===userId).map(c=>String(c.id)));

  const reactionsReceived = social.reactions.filter(r=>
    (r.target_type==='rating' && myRatingIds.has(String(r.target_id))) ||
    (r.target_type==='comment' && myCommentIds.has(String(r.target_id)))
  ).length;

  const commentsGiven = social.comments.filter(c=>c.user_id===userId).length;
  const commentsReceived = social.comments.filter(c=>
    (c.target_type==='rating' && myRatingIds.has(String(c.target_id))) ||
    (c.target_type==='comment' && myCommentIds.has(String(c.target_id)))
  ).length;

  let tasteMatchMax = 0;
  Object.keys(usersMap).forEach(otherId=>{
    if(otherId===userId) return;
    const m = tasteMatch(userId, otherId);
    if(m.pct!==null) tasteMatchMax = Math.max(tasteMatchMax, m.pct);
  });

  const scoreSpread = new Set(myR.map(r=>Math.round(r.rating))).size;

  const allUserIds = Object.keys(usersMap);
  const fullCrewFilms = allMovies.filter(m=>{
    const raters = new Set((m.ratings||[]).map(r=>r.user_id));
    return allUserIds.length>0 && allUserIds.every(id=>raters.has(id)) && raters.has(userId);
  }).length;

  let loyaltyDays = 0;
  const u = usersMap[userId];
  if(u && u.created_at){
    const t = parseDbDate(u.created_at);
    if(!isNaN(t)) loyaltyDays = Math.floor((Date.now()-t)/86400000);
  }

  return {
    rated: myR.length, notes, tens, verrisse, disappointments, heartFilms,
    genres: genreSet.size, directors: dirSet.size, directorLoyalty, genreSpecialist,
    rewatches, decades: decadeSet.size, hours: Math.round(hoursWatched),
    quickRater, streak, weekActive, monthActive, dayMarathon, nightOwl, earlyBird,
    reactionsGiven, reactionsReceived, emojiVariety, commentsGiven, commentsReceived,
    socialTotal: reactionsGiven + commentsGiven, tasteMatchMax, scoreSpread,
    fullCrewFilms, loyaltyDays
  };
}

/* ---------- unlock state, syncing, celebration ---------- */
let unlockedAch = {};      // achievement_id -> true, for the current user
let allUnlockedAch = [];   // every unlocked achievement across the whole crew

async function loadAchievements(){
  try{
    const res = await fetch('/api/achievements');
    const data = await res.json();
    allUnlockedAch = data.achievements || [];
    unlockedAch = {};
    allUnlockedAch.filter(a=>a.user_id===me.id).forEach(a=>{ unlockedAch[a.achievement_id] = true; });
  }catch(e){}
}

async function checkAchievements(){
  if(!me) return;
  const stats = computeStats(me.id);
  const newly = ACHIEVEMENTS.filter(a => !unlockedAch[a.id] && (stats[a.statKey]||0) >= a.threshold);
  if(!newly.length) return;

  for(const a of newly){
    unlockedAch[a.id] = true;
    try{
      await fetch('/api/achievements', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ user_id: me.id, achievement_id: a.id })
      });
    }catch(e){}
  }
  await loadAchievements();
  renderActivity();
  showAchievementToast(newly);
}

let achQueue = [];
function showAchievementToast(newly){
  const wasEmpty = achQueue.length === 0;
  achQueue.push(...newly);
  if(wasEmpty) achToastNext();
}
function achToastNext(){
  if(!achQueue.length) return;
  const a = achQueue[0];

/* ---------- building the feed ---------- */
function chatEntries(){
  const entries = [];

  allMovies.forEach(m=>{
    (m.ratings||[]).forEach(r=>{
      if(!r.rating_id) return;
      entries.push({
        kind:'rating', id:r.rating_id, type:'rating',
        user_id:r.user_id, name:r.name, color:r.color,
        movie:m, rating:r.rating, note:r.note,
        when: r.watched_at
      });
    });
  });

  social.comments.forEach(c=>{
    entries.push({
      kind:'comment', id:c.id, type:'comment',
      user_id:c.user_id, name:c.name, color:c.color,
      text:c.text, when:c.created_at,
      target:{ type:c.target_type, id:c.target_id }
    });
  });

  // An entry floats back up when someone reacts to or replies under it,
  // so activity on older items is actually noticed.
  const bump = (e)=>{
    let t = String(e.when||'');
    rxFor(e.type, e.id).forEach(r=>{ if(String(r.created_at) > t) t = String(r.created_at); });
    commentsFor(e.type, e.id).forEach(c=>{ if(String(c.created_at) > t) t = String(c.created_at); });
    return t;
  };

  return entries
    .map(e => ({ ...e, sortKey: bump(e) }))
    .sort((a,b)=> b.sortKey.localeCompare(a.sortKey));
}

function findEntryById(type, id){
  if(type === 'rating'){
    for(const m of allMovies){
      const r = (m.ratings||[]).find(x=>String(x.rating_id)===String(id));
      if(r) return { kind:'rating', name:r.name, movie:m, rating:r.rating, note:r.note };
    }
  } else {
    const c = social.comments.find(x=>String(x.id)===String(id));
    if(c) return { kind:'comment', name:c.name, text:c.text };
  }
  return null;
}

function rxBar(e){
  const key = e.type+':'+e.id;
  const rx = rxFor(e.type, e.id);

  const grouped = {};
  rx.forEach(r=>{
    (grouped[r.emoji] ||= { count:0, mine:false, who:[] });
    grouped[r.emoji].count++;
    grouped[r.emoji].who.push(r.name);
    if(r.user_id === me.id) grouped[r.emoji].mine = true;
  });

  const pills = Object.entries(grouped).map(([emo,g])=>`
    <span class="rx-pill ${g.mine?'mine':''}" title="${escapeHtml(g.who.join(', '))}"
      onclick="toggleReaction('${e.type}','${e.id}','${emo}')">
      ${emo}<span class="n">${g.count}</span>
    </span>`).join('');

  const picker = openPicker === key ? `
    <div class="rx-picker">
      ${RX_EMOJIS.map(emo=>`
        <button class="rx-choice" onclick="toggleReaction('${e.type}','${e.id}','${emo}')">${emo}</button>
      `).join('')}
    </div>` : '';

  const reply = openReply === key ? `
    <div class="reply-box">
      <input id="reply-input" type="text" placeholder="Antworten …" maxlength="500"
        onkeydown="if(event.key==='Enter')sendComment('${e.type}','${e.id}')">
      <button onclick="sendComment('${e.type}','${e.id}')">Senden</button>
    </div>` : '';

  return `
    <div class="rx-bar">
      ${pills}
      <button class="rx-add" onclick="togglePicker('${key}')">+</button>
      <button class="rx-reply" onclick="toggleReply('${key}')">Antworten</button>
    </div>
    ${picker}${reply}`;
}

/* ---------- taste matching ----------
   Mean absolute difference beats a naive "same score" count: an 8.0 next to
   an 8.5 is near-agreement, an 8.0 next to a 3.0 is not. Below five shared
   films the number is noise, so it isn't shown at all. */
const MIN_SHARED = 5;

function tasteMatch(idA, idB){
  const pairs = [];
  allMovies.forEach(m=>{
    const a = (m.ratings||[]).find(r=>r.user_id===idA);
    const b = (m.ratings||[]).find(r=>r.user_id===idB);
    if(a && b) pairs.push({ movie:m, a:a.rating, b:b.rating, diff:Math.abs(a.rating-b.rating) });
  });

  if(pairs.length < MIN_SHARED) return { shared:pairs.length, pct:null, pairs };

  const meanDiff = pairs.reduce((s,p)=>s+p.diff,0) / pairs.length;
  const pct = Math.max(0, Math.min(100, Math.round((1 - meanDiff/10) * 100)));
  return { shared:pairs.length, pct, pairs: pairs.sort((x,y)=>y.diff-x.diff) };
}

function renderMatches(){
  const box = document.getElementById('matchList');
  if(!box) return;

  const others = Object.values(usersMap).filter(u=>u.id !== me.id);
  if(!others.length){ box.innerHTML = '<div class="empty">Noch niemand sonst dabei.</div>'; return; }

  const rows = others.map(u=>({ u, m: tasteMatch(me.id, u.id) }))
                     .sort((x,y)=> (y.m.pct ?? -1) - (x.m.pct ?? -1));

  box.innerHTML = rows.map(({u,m})=>`
    <div class="match-row" onclick="openMemberProfile('${u.id}')">
      ${avatarHtml(u.id, u.name, u.color, 28)}
      <div class="match-name">${escapeHtml(u.name)}
        <div class="match-sub">${m.shared} gemeinsame ${m.shared===1?'Bewertung':'Bewertungen'}</div>
      </div>
      ${m.pct!==null ? `
        <div class="match-track"><div class="match-fill" id="mf-${u.id}"></div></div>
        <div class="match-pct">${m.pct}%</div>`
      : `<div class="match-pct" style="color:var(--muted);font-size:12px;font-family:Inter;">–</div>`}
    </div>`).join('');

  requestAnimationFrame(()=>{
    rows.forEach(({u,m})=>{
      if(m.pct===null) return;
      const el = document.getElementById('mf-'+u.id);
      if(el) el.style.width = m.pct + '%';
    });
  });
}

/* ---------- highlights ----------
   Only genuinely notable things, and only from the last week — a permanent
   banner nobody reads is worse than none. */
function buildHighlights(){
  const out = [];
  const weekAgo = Date.now() - 7*24*3600*1000;
  const isRecent = (iso)=>{
    if(!iso) return false;
    const t = Date.parse(String(iso).replace(' ','T')+'Z');
    return !isNaN(t) && t > weekAgo;
  };

  // Strongest taste match across the whole crew
  const ids = Object.keys(usersMap);
  let best = null;
  for(let i=0;i<ids.length;i++){
    for(let j=i+1;j<ids.length;j++){
      const m = tasteMatch(ids[i], ids[j]);
      if(m.pct !== null && (!best || m.pct > best.pct)){
        best = { pct:m.pct, a:usersMap[ids[i]], b:usersMap[ids[j]], shared:m.shared };
      }
    }
  }
  if(best && best.pct >= 75){
    out.push({
      kind:'Beste Übereinstimmung',
      main:`${best.pct}%`,
      sub:`${best.a.name} & ${best.b.name} · ${best.shared} gemeinsame Filme`,
      faces:[best.a, best.b]
    });
  }

  // Unanimous love
  const unanimous = allMovies.filter(m =>
    m.rating_count >= 3 && m.ratings.every(r => r.rating >= 9)
  );
  if(unanimous.length){
    const u = unanimous[0];
    out.push({
      kind:'Einstimmig gefeiert',
      main:u.title,
      sub:`Alle ${u.rating_count} über 9.0 · Ø ${u.average}`,
      faces:u.ratings.slice(0,4)
    });
  }

  // Biggest disagreement
  let clash = null;
  allMovies.forEach(m=>{
    if(m.rating_count < 2) return;
    const vals = m.ratings.map(r=>r.rating);
    const spread = Math.max(...vals) - Math.min(...vals);
    if(spread >= 4 && (!clash || spread > clash.spread)){
      const hi = m.ratings.find(r=>r.rating===Math.max(...vals));
      const lo = m.ratings.find(r=>r.rating===Math.min(...vals));
      clash = { movie:m, spread, hi, lo };
    }
  });
  if(clash){
    out.push({
      kind:'Größter Streit',
      main:clash.movie.title,
      sub:`${clash.hi.name} ${clash.hi.rating} vs. ${clash.lo.name} ${clash.lo.rating}`,
      faces:[clash.hi, clash.lo],
      plain:true
    });
  }

  // Crew milestone
  const total = allMovies.filter(m=>m.rating_count>0).length;
  if(total >= 10 && total % 10 === 0){
    out.push({ kind:'Meilenstein', main:`${total} Filme`, sub:'von der Crew bewertet', plain:true });
  }

  // Busiest of the week
  const counts = {};
  allMovies.forEach(m=>(m.ratings||[]).forEach(r=>{
    if(isRecent(r.watched_at)) counts[r.user_id] = (counts[r.user_id]||0)+1;
  }));
  const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  if(top && top[1] >= 3 && usersMap[top[0]]){
    out.push({
      kind:'Diese Woche aktiv',
      main:usersMap[top[0]].name,
      sub:`${top[1]} Bewertungen in sieben Tagen`,
      faces:[usersMap[top[0]]],
      plain:true
    });
  }

  return out;
}

/* ---------- silent update check ----------
   Compares the ETag of index.html against the one seen at load time.
   Cloudflare changes it on every deploy, so no version constant to maintain. */
let bootTag = null;

async function fetchTag(){
  try{
    const res = await fetch('/index.html?cb=' + Date.now(), { method:'HEAD', cache:'no-store' });
    return res.headers.get('etag') || res.headers.get('last-modified') || null;
  }catch(e){ return null; }
}

async function initUpdateCheck(){
  bootTag = await fetchTag();
  if(!bootTag) return; // headers unavailable — skip quietly rather than nag
  setInterval(checkForUpdate, 4 * 60 * 1000);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') checkForUpdate();
  });
}

async function checkForUpdate(){
  const bar = document.getElementById('updateBar');
  if(!bar || bar.classList.contains('show')) return;
  const tag = await fetchTag();
  if(tag && bootTag && tag !== bootTag){
    bar.classList.add('show');
  }
}

/* ---------- endless suggestion feed ----------
   Seeds are this person's own well-rated films; TMDB's "recommendations"
   for those beat generic popularity by a mile. Skipped films are remembered
   locally so the same title doesn't keep resurfacing. */

let feedItems = [];
let feedPage = 0;
let feedLoading = false;
let feedExhausted = false;
let feedObserver = null;
let feedStarted = false;

function skippedIds(){
  try{ return JSON.parse(localStorage.getItem('fb3000_skipped') || '[]'); }
  catch(e){ return []; }
}
function addSkipped(id){
  const s = skippedIds();
  if(!s.includes(id)){ s.push(id); localStorage.setItem('fb3000_skipped', JSON.stringify(s.slice(-400))); }
}

function startFeed(){
  if(feedStarted) return;
  feedStarted = true;

  document.getElementById('feedHead').innerHTML = `
    <div class="feed-head">
      <span class="fh-title">KÖNNTEST DU KENNEN</span>
      <span class="fh-sub">nach deinem Geschmack</span>
    </div>`;

  loadFeedPage();

  const sentinel = document.getElementById('feedSentinel');
  if(sentinel && 'IntersectionObserver' in window){
    feedObserver = new IntersectionObserver(entries=>{
      if(entries[0].isIntersecting) loadFeedPage();
    }, { rootMargin: '400px' });
    feedObserver.observe(sentinel);
  }
}

function feedExcludeList(){
  // Everything already in the crew's library plus anything this person skipped.
  return [...allMovies.map(m=>m.tmdb_id), ...skippedIds()];
}

function feedSeeds(){
  // Only films this person personally liked — 7.0 and up.
  return allMovies
    .filter(m => m.ratings.some(r => r.user_id === me.id && r.rating >= 7))
    .map(m => m.tmdb_id);
}

async function loadFeedPage(){
  if(feedLoading || feedExhausted) return;
  feedLoading = true;

  const sentinel = document.getElementById('feedSentinel');
  if(sentinel) sentinel.innerHTML = '<div class="spinner"></div>';

  feedPage++;
  try{
    const res = await fetch('/api/tmdb/suggest', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ seeds: feedSeeds(), exclude: feedExcludeList(), page: feedPage })
    });
    const data = await res.json();
    const fresh = (data.results || []).filter(m =>
      !feedItems.some(f => f.tmdb_id === m.tmdb_id)
    );

    if(!fresh.length){
      if(feedPage >= 8){ feedExhausted = true; }
    } else {
      feedItems.push(...fresh);
      appendFeedCards(fresh);
    }
  }catch(e){
    if(sentinel) sentinel.textContent = 'Vorschläge konnten nicht geladen werden.';
    feedLoading = false;
    return;
  }

  if(sentinel){
    sentinel.innerHTML = feedExhausted ? 'Das war\'s erstmal.' : '';
  }
  feedLoading = false;
}

function appendFeedCards(items){
  const list = document.getElementById('feedList');
  const html = items.map((m,i)=>{
    const year = (m.release_date||'').slice(0,4);
    const bg = m.backdrop_path ? IMG_BIG+m.backdrop_path : (m.poster_path?IMG_BIG+m.poster_path:'');
    return `
    <div class="feed-card" id="feed-${m.tmdb_id}" style="animation-delay:${Math.min(i*40,240)}ms">
      <div class="feed-poster" style="${bg?`background-image:url(${bg})`:''}" onclick='openMovie(${esc(JSON.stringify(m))})'>
        <div class="pfade"></div>
        ${m.vote_average?`<div class="feed-tmdb">★ ${m.vote_average.toFixed(1)}</div>`:''}
      </div>
      <div class="feed-body">
        <h3 class="feed-title">${escapeHtml(m.title)}</h3>
        <div class="feed-meta">${year}</div>
        <p class="feed-overview">${escapeHtml(m.overview||'')}</p>
        <div class="feed-actions">
          <button class="fa-skip" onclick="skipFeed(${m.tmdb_id})">Kenn ich nicht</button>
          <button class="fa-rate" onclick='rateFromFeed(${esc(JSON.stringify(m))})'>Hab ich gesehen</button>
        </div>
      </div>
    </div>`;
  }).join('');
  list.insertAdjacentHTML('beforeend', html);
}

function skipFeed(id){
  addSkipped(id);
  const el = document.getElementById('feed-'+id);
  if(el){
    el.style.transition = 'opacity .2s ease, transform .2s ease, max-height .3s ease, margin .3s ease';
    el.style.opacity = '0';
    el.style.transform = 'scale(.97)';
    el.style.maxHeight = el.offsetHeight + 'px';
    setTimeout(()=>{ el.style.maxHeight='0'; el.style.margin='0'; }, 60);
    setTimeout(()=>el.remove(), 380);
  }
  feedItems = feedItems.filter(f=>f.tmdb_id !== id);
}

/* Streaming availability, Germany. Flatrate (abo) is what people actually
   care about; rent/buy is shown as a plain line so it doesn't dominate. */
const IMG_LOGO = 'https://image.tmdb.org/t/p/w92';

function providerBlock(providers){
  if(!providers) return '';
  const flat = providers.flatrate || [];
  const rent = providers.rent || [];
  const buy = providers.buy || [];
  if(!flat.length && !rent.length && !buy.length) return '';

  const logos = (list)=> list.slice(0,6).map(p=>
    `<img class="prov-logo" src="${IMG_LOGO+p.logo_path}" alt="${escapeHtml(p.name)}" title="${escapeHtml(p.name)}" loading="lazy">`
  ).join('');

  let html = '<div class="prov-block">';
  if(flat.length){
    html += `<span class="prov-label">Im Abo streamen</span>
             <div class="prov-logos">${logos(flat)}</div>`;
  } else if(rent.length || buy.length){
    const list = rent.length ? rent : buy;
    html += `<span class="prov-label">${rent.length?'Leihen':'Kaufen'}</span>
             <div class="prov-logos">${logos(list)}</div>`;
  }
  html += '</div>';
  return html;
}

/* ---------- directors ---------- */
function directorStats(){
  const map = {};
  allMovies.forEach(m=>{
    if(!m.director || m.average === null) return;
    (map[m.director] ||= { name:m.director, films:[], sum:0, count:0 });
    map[m.director].films.push(m);
    map[m.director].sum += m.average;
    map[m.director].count += 1;
  });
  return Object.values(map)
    .filter(d => d.count >= 2)   // one film says nothing about a director
    .map(d => ({ ...d, avg: d.sum/d.count, films: d.films.sort((a,b)=>b.average-a.average) }))
    .sort((a,b)=> b.avg - a.avg || b.count - a.count);
}

/* ---------- shareable rating card ----------
   Drawn on a canvas at story proportions. Images go through /api/img so the
   canvas stays same-origin and toBlob() is allowed. */
async function openShareCard(movie, rating, note, rewatchCount){
  document.getElementById('modal').innerHTML = `
    <div class="modal-grip"></div>
    <div class="quiz">
      <div class="quiz-top">
        <span class="quiz-step">Bewertung teilen</span>
        <button class="modal-close" style="position:static;" onclick="closeModal()">✕</button>
      </div>
      <div id="shareHolder" style="min-height:200px;display:flex;align-items:center;justify-content:center;">
        <div class="spinner"></div>
      </div>
      <button class="btn btn-primary" id="shareGo" style="display:none;">Teilen</button>
      <button class="btn-ghost" style="width:100%;" onclick="closeModal()">Abbrechen</button>
    </div>`;
  document.getElementById('modalBg').classList.add('active');

  try{
    const blob = await buildShareCard(movie, rating, note, rewatchCount||0);
    const url = URL.createObjectURL(blob);
    document.getElementById('shareHolder').innerHTML =
      `<img class="share-preview" src="${url}" alt="Vorschau">`;

    const btn = document.getElementById('shareGo');
    btn.style.display = 'block';
    btn.onclick = ()=> doShare(blob, movie.title, url);
  }catch(e){
    document.getElementById('shareHolder').innerHTML =
      '<div class="empty">Karte konnte nicht erstellt werden.</div>';
  }
}

async function doShare(blob, title, fallbackUrl){
  const file = new File([blob], 'bewertung.png', { type:'image/png' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{
      await navigator.share({ files:[file], title });
      return;
    }catch(e){
      if(e && e.name === 'AbortError') return; // user cancelled
    }
  }
  // Fallback: open in a new tab so it can be saved manually.
  const a = document.createElement('a');
  a.href = fallbackUrl;
  a.download = 'bewertung.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('Bild gespeichert');
}

function loadImg(src){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = ()=>resolve(null);
    img.src = src;
  });
}

function topBadges(n){
  return ACHIEVEMENTS
    .filter(a=>unlockedAch[a.id])
    .sort((a,b)=> b.tier - a.tier)
    .slice(0, n);
}

async function buildShareCard(movie, rating, note, rewatchCount){
  const W = 1080, H = 1500;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // Make sure the display face is actually available to canvas.
  try{
    await document.fonts.load('400 100px "Bebas Neue"');
    await document.fonts.load('700 30px "Inter"');
  }catch(e){}

  ctx.fillStyle = '#0F1115';
  ctx.fillRect(0,0,W,H);

  const backdrop = movie.backdrop_path
    ? await loadImg('/api/img/w780' + movie.backdrop_path) : null;
  const poster = movie.poster_path
    ? await loadImg('/api/img/w500' + movie.poster_path) : null;

  // Blurred backdrop as atmosphere
  if(backdrop){
    ctx.save();
    ctx.filter = 'blur(28px) saturate(1.2)';
    const s = Math.max(W/backdrop.width, H/backdrop.height) * 1.15;
    const bw = backdrop.width*s, bh = backdrop.height*s;
    ctx.globalAlpha = 0.5;
    ctx.drawImage(backdrop, (W-bw)/2, (H-bh)/2, bw, bh);
    ctx.restore();
    ctx.fillStyle = 'rgba(15,17,21,0.62)';
    ctx.fillRect(0,0,W,H);
  }

  // Poster
  const pw = 400, ph = 600, px = (W-pw)/2, py = 100;
  if(poster){
    roundRect(ctx, px, py, pw, ph, 18);
    ctx.save(); ctx.clip();
    ctx.drawImage(poster, px, py, pw, ph);
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,0.09)';
    ctx.lineWidth = 2;
    roundRect(ctx, px, py, pw, ph, 18); ctx.stroke();
  }

  // Everything below the poster is laid out top-down with a running
  // cursor `y`, so rewatch chip / note / badges never collide no
  // matter how many of them are present for a given rating.
  let y = py + ph + 66;

  // Title
  ctx.textAlign = 'center';
  ctx.fillStyle = '#EDEFF2';
  ctx.font = '400 60px "Bebas Neue", sans-serif';
  const lines = wrapText(ctx, (movie.title||'').toUpperCase(), W - 140);
  lines.slice(0,2).forEach((ln,i)=> ctx.fillText(ln, W/2, y + i*62));
  y += Math.min(lines.length,2)*62 + 12;

  // Year / director
  ctx.fillStyle = '#8B93A1';
  ctx.font = '500 24px Inter, sans-serif';
  const meta = [ (movie.release_date||'').slice(0,4), movie.director ].filter(Boolean).join('  ·  ');
  if(meta){ ctx.fillText(meta, W/2, y); y += 30; }

  y += 90;

  // Score
  const cy = y;
  ctx.beginPath();
  ctx.arc(W/2, cy, 68, 0, Math.PI*2);
  ctx.fillStyle = '#E8A33D';
  ctx.fill();
  ctx.fillStyle = '#221703';
  ctx.font = '400 80px "Bebas Neue", sans-serif';
  ctx.fillText(rating.toFixed(1), W/2, cy + 27);
  y = cy + 68 + 44;

  // Rewatch chip
  if(rewatchCount > 0){
    const label = `↻  ${rewatchCount+1}× geschaut`;
    ctx.font = '700 26px Inter, sans-serif';
    const tw = ctx.measureText(label).width;
    const padX = 24, chipH = 46;
    const chipW = tw + padX*2;
    const chipX = W/2 - chipW/2;
    roundRect(ctx, chipX, y, chipW, chipH, chipH/2);
    ctx.fillStyle = 'rgba(232,163,61,0.14)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(232,163,61,0.55)';
    ctx.lineWidth = 2;
    roundRect(ctx, chipX, y, chipW, chipH, chipH/2); ctx.stroke();
    ctx.fillStyle = '#E8A33D';
    ctx.fillText(label, W/2, y + chipH/2 + 9);
    y += chipH + 34;
  }

  // Note
  if(note){
    ctx.fillStyle = '#C5CAD3';
    ctx.font = 'italic 500 28px Inter, sans-serif';
    const nl = wrapText(ctx, '„' + note + '"', W - 200);
    nl.slice(0,2).forEach((ln,i)=> ctx.fillText(ln, W/2, y + i*38));
    y += Math.min(nl.length,2)*38 + 24;
  }

  // Top achievement badges
  const badges = topBadges(4);
  if(badges.length){
    y += 16;
    ctx.fillStyle = '#8B93A1';
    ctx.font = '700 20px Inter, sans-serif';
    ctx.fillText('TOP ABZEICHEN', W/2, y);
    y += 40;

    const bSize = 76, bGap = 18;
    const totalW = badges.length*bSize + (badges.length-1)*bGap;
    let bx = W/2 - totalW/2 + bSize/2;
    badges.forEach(b=>{
      ctx.beginPath();
      ctx.arc(bx, y + bSize/2, bSize/2, 0, Math.PI*2);
      ctx.fillStyle = '#1D2129';
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = b.tierColor;
      ctx.stroke();
      ctx.font = '36px sans-serif';
      ctx.fillStyle = '#EDEFF2';
      ctx.fillText(b.icon, bx, y + bSize/2 + 13);
      bx += bSize + bGap;
    });
    y += bSize + 26;
  }

  // Footer, pinned right after whatever content came before it
  y += 20;
  ctx.strokeStyle = 'rgba(232,163,61,0.55)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(W/2 - 60, y); ctx.lineTo(W/2 + 60, y);
  ctx.stroke();

  ctx.fillStyle = '#8B93A1';
  ctx.font = '700 24px Inter, sans-serif';
  ctx.fillText((me?me.name:'') + '  ·  FILMBEWERTER3000', W/2, y + 46);

  return new Promise((resolve, reject)=>{
    canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/png');
  });
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
}

function wrapText(ctx, text, maxWidth){
  const words = String(text||'').split(' ');
  const lines = [];
  let line = '';
  for(const w of words){
    const test = line ? line + ' ' + w : w;
    if(ctx.measureText(test).width > maxWidth && line){
      lines.push(line); line = w;
    } else line = test;
  }
  if(line) lines.push(line);
  return lines;
}

/* swipe the modal down on the grip handle to dismiss — small iOS-native touch */
function attachSwipeToClose(){
  const grip = document.querySelector('.modal-grip');
  const modal = document.getElementById('modal');
  if(!grip || !modal) return;
  let startY = 0, dragging = false;
  grip.addEventListener('touchstart', e=>{ startY = e.touches[0].clientY; dragging = true; modal.style.transition='none'; }, {passive:true});
  grip.addEventListener('touchmove', e=>{
    if(!dragging) return;
    const dy = e.touches[0].clientY - startY;
    if(dy>0) modal.style.transform = `translateY(${dy}px)`;
  }, {passive:true});
  grip.addEventListener('touchend', e=>{
    if(!dragging) return;
    dragging = false;
    modal.style.transition = '';
    const dy = e.changedTouches[0].clientY - startY;
    if(dy > 100){ closeModal(); }
    modal.style.transform = '';
  });
}

/* ---------- guided rating flow ---------- */
function startQuiz(){
  quiz = { step:0, scores:{}, adjust:0, note:'' };
  renderQuiz();
}

function renderQuiz(){
  const total = DIMENSIONS.length;
  if(quiz.step >= total){ renderQuizResult(); return; }

  const d = DIMENSIONS[quiz.step];
  const chosen = quiz.scores[d.key];
  const pct = (quiz.step / total) * 100;

  document.getElementById('modal').innerHTML = `
    <div class="quiz">
      <div class="quiz-top">
        <span class="quiz-step">Frage ${quiz.step+1} von ${total}</span>
        <button class="modal-close" style="position:static;" onclick="closeModal()">✕</button>
      </div>
      <div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>

      <div class="quiz-dim">${d.label} · ${Math.round(d.weight*100)}%</div>
      <p class="quiz-q">${d.question}</p>

      <div class="opts">
        ${d.options.map(o=>`
          <button class="opt ${chosen===o.v?'chosen':''}" onclick="answer('${d.key}', ${o.v})">
            <span class="pip"></span><span>${o.t}</span>
          </button>`).join('')}
      </div>

      <div class="quiz-nav">
        ${quiz.step>0?`<button class="btn-ghost" onclick="quizBack()">← Zurück</button>`:'<span></span>'}
        <span class="quiz-step">${quiz.step+1}/${total}</span>
      </div>
    </div>`;
}

function answer(key, value){
  quiz.scores[key] = value;
  quiz.step++;
  renderQuiz();
}
function quizBack(){
  if(quiz.step>0){ quiz.step--; renderQuiz(); }
}

function renderQuizResult(){
  const base = computeScore(quiz.scores, 0);
  const final = computeScore(quiz.scores, quiz.adjust);

  document.getElementById('modal').innerHTML = `
    <div class="quiz">
      <div class="quiz-top">
        <span class="quiz-step">Ergebnis</span>
        <button class="modal-close" style="position:static;" onclick="closeModal()">✕</button>
      </div>
      <div class="progress"><div class="progress-fill" style="width:100%"></div></div>

      <div class="result-score">
        <div class="num" id="finalNum">0.0</div>
        <div class="cap">${escapeHtml(currentMovie.title)}</div>
      </div>

      <div class="breakdown">
        ${DIMENSIONS.map(d=>`
          <div class="bd-row">
            <span class="bn">${d.label}</span>
            <span class="bd-track"><span class="bd-fill" id="bd-${d.key}" style="width:0%"></span></span>
            <span class="bv">${quiz.scores[d.key]}</span>
          </div>`).join('')}
      </div>

      <div class="adjust">
        <label>Bauchgefühl</label>
        <p class="hint">Berechnet wurde ${base.toFixed(1)}. Wenn sich das falsch anfühlt, korrigier es hier um bis zu einen Punkt — manche Filme sind mehr als die Summe ihrer Teile.</p>
        <input type="range" min="-1" max="1" step="0.1" value="${quiz.adjust}" oninput="onAdjust(this.value)">
        <div class="adj-val" id="adjVal">${quiz.adjust>0?'+':''}${Number(quiz.adjust).toFixed(1)}</div>
      </div>

      <textarea id="quizNote" placeholder="Ein Satz zum Film (optional)">${escapeHtml(quiz.note)}</textarea>

      <button class="btn btn-primary" onclick="saveQuiz()">Bewertung speichern</button>
      <button class="btn-ghost" style="width:100%;margin-top:4px;" onclick="quizBack()">← Letzte Frage ändern</button>
    </div>`;

  // animate bars in, then count up the final number
  requestAnimationFrame(()=>{
    DIMENSIONS.forEach(d=>{
      const el = document.getElementById('bd-'+d.key);
      if(el) el.style.width = (quiz.scores[d.key]*10)+'%';
    });
    countUpTo(final);
  });
}

function countUpTo(target){
  const el = document.getElementById('finalNum');
  if(!el) return;
  const duration = 500;
  const start = performance.now();
  function frame(now){
    const t = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-t, 3);
    el.textContent = (target*eased).toFixed(1);
    if(t<1) requestAnimationFrame(frame);
    else el.textContent = target.toFixed(1);
  }
  requestAnimationFrame(frame);
}

function onAdjust(v){
  quiz.adjust = parseFloat(v);
  const final = computeScore(quiz.scores, quiz.adjust);
  document.getElementById('finalNum').textContent = final.toFixed(1);
  document.getElementById('adjVal').textContent = (quiz.adjust>0?'+':'') + quiz.adjust.toFixed(1);
}

async function saveQuiz(){
  const noteEl = document.getElementById('quizNote');
  quiz.note = noteEl ? noteEl.value.trim() : '';
  const rating = computeScore(quiz.scores, quiz.adjust);

  const res = await fetch('/api/ratings', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      user_id: me.id,
      movie: currentMovie,
      rating,
      note: quiz.note,
      scores: { ...quiz.scores, adjust: quiz.adjust }
    })
  });
  const data = await res.json();
  if(data.error){ toast(data.error); return; }

  toast('Gespeichert: ' + rating.toFixed(1));
  const ratedId = currentMovie.tmdb_id;
  quiz = null;
  await loadMovies();
  renderWall();

  // Drop it from the suggestion feed and refresh the open-tasks list
  // without tearing down the feed the person is scrolling through.
  const fc = document.getElementById('feed-' + ratedId);
  if(fc) fc.remove();
  feedItems = feedItems.filter(f => f.tmdb_id !== ratedId);
  await loadSocial();
  refreshHomeTasks();

  await renderDetail();
  await loadAchievements();
  checkAchievements();
}

function paintTopList(rated){

  const sorted = [...rated].sort((a,b)=>b.average-a.average);
  if(!sorted.length){ box.innerHTML = '<div class="empty">Noch keine Daten.</div>'; return; }

  box.innerHTML = shown.map((m,i)=>`

      <div class="lb-info">
        <div class="lb-title">${escapeHtml(m.title)}</div>
        <div class="lb-sub">${m.rating_count} Bewertung${m.rating_count===1?'':'en'}</div>
      </div>
      <div class="lb-score">${m.average}</div>
    </div>`).join('')
    + (sorted.length > 5 ? `
      <button class="expand-btn" onclick="toggleTopList()">
        ${topExpanded ? 'Weniger anzeigen' : `Alle ${sorted.length} Filme anzeigen`}
      </button>` : '');
}

function toggleTopList(){
  topExpanded = !topExpanded;
  renderStats();
  if(topExpanded){
    // keep the button in view after the list grows
    requestAnimationFrame(()=>{
      const b = document.querySelector('#topList .expand-btn');
      if(b) b.scrollIntoView({block:'nearest'});
    });
  }
}

function renderStats(){
  const rated = allMovies.filter(m=>m.rating_count>0);
  const totalRatings = rated.reduce((s,m)=>s+m.rating_count,0);
  const overallAvg = totalRatings ? (rated.reduce((s,m)=>s+m.average*m.rating_count,0)/totalRatings) : 0;

  const userMap = {};
  rated.forEach(m=>m.ratings.forEach(r=>{
    (userMap[r.user_id] ||= {name:r.name, color:r.color, sum:0, count:0}).sum += r.rating;
    userMap[r.user_id].count += 1;
  }));
  const users = Object.values(userMap).map(u=>({...u, avg:u.sum/u.count})).sort((a,b)=>b.avg-a.avg);

  document.getElementById('statCards').innerHTML = `
    <div class="stat-card"><div class="num">${rated.length}</div><div class="lbl">Filme gesehen</div></div>
    <div class="stat-card"><div class="num">${totalRatings}</div><div class="lbl">Bewertungen</div></div>
    <div class="stat-card"><div class="num">${overallAvg?overallAvg.toFixed(1):'–'}</div><div class="lbl">Ø Crew-Wertung</div></div>
    <div class="stat-card"><div class="num">${users.length}</div><div class="lbl">Mitglieder</div></div>`;

  paintTopList(rated);

  document.getElementById('userBars').innerHTML = users.length ? users.map(u=>`
    <div class="bar-row">
      <div class="bname">${escapeHtml(u.name)}</div>
      <div class="bar-track"><div class="bar-fill" id="ub-${u.name.replace(/[^a-zA-Z0-9]/g,'')}" style="background:${u.color}"></div></div>
      <div class="bval">${u.avg.toFixed(1)}</div>
    </div>`).join('') : '<div class="empty">Noch keine Daten.</div>';

  requestAnimationFrame(()=>{
    users.forEach(u=>{
      const el = document.getElementById('ub-'+u.name.replace(/[^a-zA-Z0-9]/g,''));
      if(el) el.style.width = (u.avg/10*100).toFixed(0)+'%';
    });
  });

  renderDirectors();
}

/* ---------- helpers ---------- */
function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}
function esc(json){ return json.replace(/'/g,'&#39;'); }

loadUser();
initUpdateCheck();
</script>
</body>
</html>
